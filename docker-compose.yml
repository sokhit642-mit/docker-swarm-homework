services:
  app:
    build: .
    container_name: homework_app
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: homeworkdb
      APP_VERSION: v1
    networks:
      - appnet

  db:
    image: mysql:8.0
    container_name: homework_db
    restart: always
    environment:
      MYSQL_DATABASE: homeworkdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
    driver: bridge
